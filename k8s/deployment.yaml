apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: auth-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: acrlabsankara01.azurecr.io/auth-api:0.2
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jwt
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
